  <article>
    <h3>
      Class e Style Binding / Ligação de Classe e Estilo
    </h3>
    <div>
      selecione uma classe:
      <select #class (change)="0">
        <option value="alert-success">Sucesso</option>
        <option value="alert-info">Info</option>
        <option value="alert-warning">Alerta</option>
        <option value="alert-danger">Erro</option>
      </select>
      <br><br>

      <div class="alert {{ class.value }}" role="alert">
        Texto colorido com interpolação: {{ class.value }}
      </div>
      <div class="alert" role="alert" [class.alert-success]="class.value === 'alert-success'">
        Sucesso
      </div>
      <div class="alert" role="alert" [class.alert-info]="class.value === 'alert-info'">
        Info
      </div>
      <div class="alert" role="alert" [class.alert-warning]="class.value === 'alert-warning'">
        Alerta
      </div>
      <div class="alert" role="alert" [class.alert-danger]="class.value === 'alert-danger'">
        Erro
      </div>


      <div class="alert alert-danger" role="alert" [style.display]="class.value === 'alert-danger' ? 'block' : 'none'">
        Esse texto somente aparece em caso de erro.
      </div>
    </div>
  </article>

</section>
